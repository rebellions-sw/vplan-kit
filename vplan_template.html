/* Renumber F##/VI### to match the current list order. Every reference is rewritten in the same pass,
   from a map captured BEFORE any id changes — so links survive even when ids swap places. */
function renumberIds(){
  const map={};
  const put=(row,nid)=>{ if(row.id&&row.id!==nid) map[row.id]=nid; row.id=nid; };
  DATA.features.forEach((f,i)=>put(f,'F'+String(i+1).padStart(2,'0')));
  DATA.items.forEach((it,i)=>put(it,'VI'+String(i+1).padStart(3,'0')));
  const m=id=>map[id]||id;
  const remap=a=>(a||[]).map(m);
  DATA.items.forEach(it=>{ it.feature_refs=remap(it.feature_refs); });
  DATA.features.forEach(f=>{ if(f.related_refs) f.related_refs=remap(f.related_refs); });
  DATA.testcases.forEach(t=>{ t.feature_refs=remap(t.feature_refs); });
  DATA.coverage.functional.forEach(g=>{ g.feature_refs=remap(g.feature_refs); });
  DATA.coverage.assertions.forEach(a=>{ a.feature_refs=remap(a.feature_refs); });
  (DATA.suggestions||[]).forEach(x=>{ if(x.accepted_as) x.accepted_as=m(x.accepted_as); });
  (DATA.audits||[]).forEach(x=>{ if(x.target) x.target=m(x.target); if(x.accepted_as) x.accepted_as=m(x.accepted_as);
    if(x.fix&&x.fix.feature_refs) x.fix.feature_refs=remap(x.fix.feature_refs); });
  Object.values(FILTER).forEach(f=>{                       // keep an active filter pointing at the same row
    ['vref','fref'].forEach(k=>{ if(f[k]&&f[k]!=='__none__') f[k]=m(f[k]); });
  });
  const n=Object.keys(map).length;
  markDirty(); render();
  toast(n?`${n} id(s) renumbered — references updated`:'ids already in order');
}
function lint(){
  /* One line per KIND of problem, with every offending id listed on it — a hundred separate lines
     for the same mistake is unreadable, and the ids are what you act on. */
  const G=[];
  const grp=(sev,scope,msg,countOnly)=>{ const x={sev,scope,msg,ids:[],countOnly:!!countOnly}; G.push(x); return x; };
  const dupId   =grp('err','plan','duplicate id');
  const noId    =grp('err','plan','row with no id');
  const dangling=grp('err','plan','reference points at an id that does not exist');
  /* which phase made these due is on the panel head, so it is not repeated on every line */
  const unCov   =grp('err','feature','no verification item is linked');
  const unDef   =grp('err','feature','definition is not finalized');
  const unRevF  =grp('err','feature','Confirmed is not ticked');
  const gapF    =grp('warn','feature','some fields are still empty');
  const itemNoF =grp('warn','item','no feature is linked');
  const itemUnD =grp('err','item','definition is not finalized');
  const itemUnI =grp('err','item','implemented is not done');
  const unRevI  =grp('err','item','Confirmed is not ticked');
  const gapI    =grp('warn','item','some fields are still empty');
  const tcNoCls =grp('err','plan','testcase has no uvm.test_class');
  const tcNoChk =grp('err','plan','testcase has no checks');
  const tcNoSeq =grp('warn','plan','testcase has no sequence');
  const tcNoSeed=grp('warn','plan','testcase has no seeds');
  const cgNoRef =grp('warn','plan','covergroup has no feature');
  const svaNoMod=grp('warn','plan','assertion has no bind module');
  const sugOpen =grp('warn','plan','suggestions pending review — see Suggestions from AI',true);   // the ids add nothing here
  const sugNoLbl=grp('warn','plan','rejection has no label (duplicated / hallucinated / waived)');
  const sugNoQ  =grp('warn','plan','pending suggestion has no quote — the claim cannot be checked');
  const relCat  =grp('warn','plan',`related-to link does not point at a category ${REL_CAT} feature`);
  const audOpen =grp('warn','plan','audit findings pending review — see Audit from AI',true);
  const audNoTgt=grp('err','plan','audit card points at a row that does not exist');
  const audNoQ  =grp('warn','plan','pending audit finding has no quote — the claim cannot be checked');

  const ids=a=>a.map(x=>x.id);
  const dup=a=>{const seen=new Set(),d=new Set();a.forEach(x=>{if(seen.has(x))d.add(x);seen.add(x)});return [...d]};
  [['features',DATA.features],['items',DATA.items],['testcases',DATA.testcases],
   ['coverage.functional',DATA.coverage.functional],['coverage.assertions',DATA.coverage.assertions]].forEach(([n,a])=>{
    dup(ids(a)).forEach(d=>dupId.ids.push(d));
    a.forEach((x,i)=>{ if(!x.id) noId.ids.push(`${n}[${i}]`); });
  });

  const fids=new Set(ids(DATA.features));
  const cids=new Set([...ids(DATA.coverage.functional),...ids(DATA.coverage.assertions)]);
  const tids=new Set(ids(DATA.testcases));

  const PH=DATA.$enums.phase||[];
  const now=PH.indexOf(DATA.meta.phase);
  const due=r=>{ const i=PH.indexOf(r.phase); return i>=0 && now>=0 && i<=now; };

  /* every stored field must hold something — an empty cell or an unpicked select is unfinished work.
     `reviewed` is a boolean with its own rule above, so it is not counted as "empty" here. */
  const blanks=r=>Object.keys(r).filter(k=>k!=='reviewed' &&
    (r[k]==null || r[k]==='' || (Array.isArray(r[k]) && !r[k].length)));

  const covered=new Set(DATA.items.flatMap(it=>it.feature_refs||[]));
  DATA.features.forEach(f=>{
    if(!due(f)) return;                     // a later phase is not this plan's problem yet
    if(!covered.has(f.id)) unCov.ids.push(f.id);
    if(f.status!=='finalized') unDef.ids.push(`${f.id}(${f.status||'—'})`);
    if(!f.reviewed) unRevF.ids.push(f.id);
  });
  DATA.features.forEach(f=>{ if(blanks(f).length) gapF.ids.push(f.id); });

  /* a related-to link must resolve, and must still name a command feature: the category can be edited
     after the link was made, and a link to a behavior row is a mistake worth showing. */
  DATA.features.forEach(f=>{
    (f.related_refs||[]).forEach(r=>{
      const t=DATA.features.find(x=>x.id===r);
      if(!t) dangling.ids.push(`${f.id}→${r}`);
      else if(t.category!==REL_CAT) relCat.ids.push(`${f.id}→${r}`);
    });
  });

  DATA.items.forEach(it=>{
    (it.feature_refs||[]).forEach(r=>{ if(!fids.has(r)) dangling.ids.push(`${it.id}→${r}`); });
    if(!due(it)) return;
    if(!(it.feature_refs||[]).length) itemNoF.ids.push(it.id);
    if(it.status!=='finalized')       itemUnD.ids.push(`${it.id}(${it.status||'—'})`);
    if(it.implemented!=='done')       itemUnI.ids.push(`${it.id}(${it.implemented||'—'})`);
    if(!it.reviewed)                  unRevI.ids.push(it.id);
  });
  DATA.items.forEach(it=>{ if(blanks(it).length) gapI.ids.push(it.id); });

  DATA.testcases.forEach(t=>{
    (t.feature_refs||[]).forEach(r=>{ if(!fids.has(r)) dangling.ids.push(`${t.id}→${r}`); });
    (t.coverage_refs||[]).forEach(r=>{ if(!cids.has(r)) dangling.ids.push(`${t.id}→${r}`); });
    (t.dependencies||[]).forEach(r=>{ if(!tids.has(r)) dangling.ids.push(`${t.id}→${r}`); });
    if(!t.uvm||!t.uvm.test_class) tcNoCls.ids.push(t.id);
    if(!t.uvm||!(t.uvm.sequences||[]).length) tcNoSeq.ids.push(t.id);
    if(!(t.checks||[]).length) tcNoChk.ids.push(t.id);
    if(!(+t.seeds>0)) tcNoSeed.ids.push(t.id);
  });
  DATA.coverage.functional.forEach(g=>{ if(!(g.feature_refs||[]).length) cgNoRef.ids.push(g.id); });
  DATA.coverage.assertions.forEach(a=>{ if(!a.module) svaNoMod.ids.push(a.id); });

  const sug=DATA.suggestions||[];
  dup(sug.map(x=>x.sid)).forEach(d=>dupId.ids.push(d));
  sug.forEach(x=>{
    if(x.status==='pending') sugOpen.ids.push(x.sid);
    if(x.status==='rejected'&&!x.reject_kind) sugNoLbl.ids.push(x.sid);
    if(x.status==='pending'&&!(x.source&&x.source.quote)) sugNoQ.ids.push(x.sid);
  });
  const rowIds={feature:new Set(DATA.features.map(f=>f.id)),item:new Set(DATA.items.map(i=>i.id))};
  (DATA.audits||[]).forEach(x=>{
    if(x.status==='pending'){
      audOpen.ids.push(x.aid);
      if(!(x.source&&x.source.quote)) audNoQ.ids.push(x.aid);
      if(x.finding!=='missing'&&!rowIds[(x.kind||'feature')==='item'?'item':'feature'].has(x.target)) audNoTgt.ids.push(x.aid);
    }
    if(x.status==='rejected'&&!x.reject_kind) sugNoLbl.ids.push(x.aid);
  });

  // agent names that differ by a keystroke are typos; rare ones are not
  const agentUse={};
  DATA.testcases.forEach(t=>((t.uvm&&t.uvm.sequences)||[]).forEach(q=>{ if(q.agent) agentUse[q.agent]=(agentUse[q.agent]||0)+1; }));
  const ed=(a,b)=>{ const m=a.length,n=b.length; let prev=[...Array(n+1).keys()];
    for(let i=1;i<=m;i++){ const cur=[i];
      for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
      prev=cur; } return prev[n]; };
  const typos=grp('warn','plan','agent names differ by a keystroke — probably a typo');
  const an=Object.keys(agentUse);
  for(let i=0;i<an.length;i++) for(let j=i+1;j<an.length;j++)
    if(Math.min(an[i].length,an[j].length)>=4 && ed(an[i],an[j])<=2) typos.ids.push(`${an[i]} ~ ${an[j]}`);

  const live=G.filter(x=>x.ids.length);
  const errs=live.filter(x=>x.sev==='err').reduce((n,x)=>n+x.ids.length,0);
  const warns=live.filter(x=>x.sev==='warn').reduce((n,x)=>n+x.ids.length,0);
  const B={err:'b-err',warn:'b-warn'};
  const inv=Object.keys(agentUse).sort().map(a=>`<span class="badge b-acc">${esc(a)} ×${agentUse[a]}</span>`).join('');
  const html=`<div class="panel lintbox"><div class="panel-head"><h2>Lint</h2>
    <span class="badge ${errs?'b-err':'b-ok'}">${errs} error</span>
    <span class="badge b-warn">${warns} warning</span>
    <span class="hint">phase: ${esc(DATA.meta.phase||'—')}</span>
    <div class="spacer"></div><button class="btn sm" data-act="lint-close">닫기</button></div>
    <div class="panel-body">
      ${inv?`<div class="lint-group"><span class="badge b-mut">AGENTS</span><div class="lg-body"><div class="chips">${inv}</div></div></div>`:''}
      ${live.length?['feature','item','plan'].map(sc=>{
        const rows=live.filter(x=>x.scope===sc); if(!rows.length) return '';
        const e=rows.filter(x=>x.sev==='err').reduce((n,x)=>n+x.ids.length,0);
        const w=rows.reduce((n,x)=>n+x.ids.length,0)-e;
        return `<div class="lint-sec">
          <div class="lint-sec-head"><span class="scope s-${sc}">${sc==='item'?'verification items':sc==='feature'?'features':'plan'}</span>
            ${e?`<span class="badge b-err">${e} error</span>`:''}${w?`<span class="badge b-warn">${w} warning</span>`:''}</div>
          ${rows.map(x=>`
          <div class="lint-group" data-scope="${sc}"><span class="badge ${B[x.sev]}">${x.sev==='err'?'ERR':'WARN'}</span>
            <div class="lg-body">
              <div class="lg-title">${esc(x.msg)} <span class="lg-n">(${x.ids.length})</span></div>
              ${x.countOnly?'':`<div class="chips">${x.ids.map(id=>`<span class="badge b-mut">${esc(id)}</span>`).join('')}</div>`}
            </div></div>`).join('')}
        </div>`;
      }).join('')
      :'<div class="lint-group"><span class="badge b-ok">OK</span><div class="lg-body">문제 없음 ✓</div></div>'}
    </div></div>`;
  const old=$('.lintbox'); if(old) old.remove();
  $('#tabbody').insertAdjacentHTML('afterbegin',html);
  $('.lintbox').scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* ---- export ----------------------------------------------------------- */
function toYaml(obj,ind){
  ind=ind||0;
  const pad='  '.repeat(ind), out=[];
  for(const k of Object.keys(obj)){
    const v=obj[k];
    if(v===null||v===undefined){ out.push(pad+k+': null'); }
    else if(Array.isArray(v)){
      if(!v.length){ out.push(pad+k+': []'); continue; }
      out.push(pad+k+':');
      for(const it of v){
        if(it!==null && typeof it==='object'){
          const sub=toYaml(it,ind+2).split('\n');
          out.push(pad+'  - '+sub[0].trimStart());
          for(let i=1;i<sub.length;i++) out.push(sub[i]);
        } else out.push(pad+'  - '+scalar(it));
      }
    }
    else if(typeof v==='object'){
      if(!Object.keys(v).length){ out.push(pad+k+': {}'); }
      else { out.push(pad+k+':'); out.push(toYaml(v,ind+1)); }
    }
    else out.push(pad+k+': '+scalar(v));
  }
  return out.join('\n');
}
function scalar(x){
  if(typeof x==='number'||typeof x==='boolean') return String(x);
  if(x===null||x===undefined) return 'null';
  const s=String(x);
  if(s==='') return '""';
  if(/^\s|\s$/.test(s)) return JSON.stringify(s);
  if(/[\n"']/.test(s)) return JSON.stringify(s);
  if(/^[-?:,\[\]{}#&*!|>%@`]/.test(s)) return JSON.stringify(s);
  if(/:\s/.test(s)||/\s#/.test(s)) return JSON.stringify(s);
  if(/^(true|false|null|yes|no|on|off|~)$/i.test(s)) return JSON.stringify(s);
  if(/^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(s)) return JSON.stringify(s);
  return s;
}
function download(name,text,mime){
  const b=new Blob([text],{type:mime||'text/plain;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function serializeDoc(snapshotAt){
  const clone=document.documentElement.cloneNode(true);
  clone.querySelector('#app').innerHTML='';
  clone.querySelector('#app').removeAttribute('style');   // measured sticky offsets are not document content
  clone.querySelector('#toast').textContent='';
  clone.querySelector('#toast').className='toast';
  // a Save As copy is stamped as a snapshot: reopened, it shows the stamp instead of Save buttons
  const d = snapshotAt ? {...DATA, meta:{...DATA.meta, snapshot:{at:snapshotAt}}} : DATA;
  clone.querySelector('#vplan-data').textContent='\n'+JSON.stringify(d,null,2)+'\n';
  clone.querySelector('title').textContent=`Verification Plan — ${DATA.meta.ip_name}`;
  return '<!DOCTYPE html>\n'+clone.outerHTML+'\n';
}
/* Two kinds of file, two kinds of save. The ORIGINAL (created by vplan_create) saves with no dialog:
   Save posts the document to the local vplan-save helper (127.0.0.1:8790), which writes the real
   ~/vplans/vplan_<IP>.html in place — Chrome itself cannot write a file without a picker, and cannot
   write into ~/Documents on this machine at all. Save As writes a dated SNAPSHOT copy: a fork that,
   reopened, has no Save buttons at all — just the stamp of when it was made, where the buttons were.
   Nothing follows the picked file, nothing is remembered, nothing lives in browser storage. */
const isSnapshot=()=>!!(DATA.meta&&DATA.meta.snapshot);
function stampNow(){
  const t=new Date(), p=n=>String(n).padStart(2,'0');
  return `${t.getFullYear()}-${p(t.getMonth()+1)}-${p(t.getDate())} ${p(t.getHours())}:${p(t.getMinutes())}:${p(t.getSeconds())}`;
}
/* Load pulls a snapshot's DATA into this original — on screen only, marked dirty; the file on disk
   changes when the user presses Save. Only snapshot files are accepted: originals hold the live
   truth, snapshots are the restore points. The marker is stripped on the way in, so loading can
   never turn an original read-only. A wrong Load is undone by reloading the page without saving. */
async function loadSnapshot(){
  if(isSnapshot()) return;
  try{
    let text, fname;
    if(window.showOpenFilePicker){
      const [h]=await window.showOpenFilePicker({id:'vplan',startIn:'documents',
        types:[{description:'vplan snapshot',accept:{'text/html':['.html']}}]});
      const f=await h.getFile(); fname=f.name; text=await f.text();
    }else{
      text=await new Promise((res,rej)=>{
        const i=document.createElement('input'); i.type='file'; i.accept='.html';
        i.onchange=()=>{ const f=i.files[0]; if(!f){ const e=new Error(''); e.name='AbortError'; rej(e); return; }
                         fname=f.name; f.text().then(res,rej); };
        i.click();
      });
    }
    // built in two halves: if this code carried the full tag byte-sequence, every "find the LAST
    // data block tag" parser (this one, the agent scripts) would grab the code instead of the block
    const tag='<script id="vplan-data"'+' type="application/json">';
    const i0=text.lastIndexOf(tag);         // last hit: the header comment above cites the tag too
    const j0=i0<0?-1:text.indexOf('</'+'script>',i0);
    if(i0<0||j0<0){ toast('vplan 문서가 아닙니다: '+fname); return; }
    const d=JSON.parse(text.slice(i0+tag.length,j0));
    if(!d||!d.meta){ toast('vplan 데이터가 없습니다: '+fname); return; }
    if(!d.meta.snapshot){ toast('스냅샷 파일이 아닙니다 — Load는 Save As로 만든 스냅샷만 받습니다'); return; }
    const at=d.meta.snapshot.at;
    delete d.meta.snapshot;                 // the original must stay an original
    DATA=d; markDirty(); render();
    toast('스냅샷 로드됨: '+fname+' ('+at+') — Save를 눌러야 파일에 반영됩니다');
  }catch(e){
    if(e.name==='AbortError') return;       // cancelled picker
    toast('로드 실패 ('+(e.message||e.name)+')');
  }
}
async function saveHtml(saveAs){
  if(isSnapshot()){ toast('스냅샷 파일입니다 — 저장은 원본에서만 됩니다'); return; }
  const here=decodeURIComponent((location.pathname.split('/').pop()||''));
  const name=/\.html?$/i.test(here) ? here : `vplan_${DATA.meta.ip_name||'plan'}.html`.replace(/[^\w.\-]/g,'_');
  if(saveAs){
    const at=stampNow();
    const content=serializeDoc(at);
    // a dated suggested name, so a reflexive Enter cannot land the snapshot on the original file
    const snapName=name.replace(/\.html?$/i,'')+'_'+at.replace(/-/g,'').replace(/:/g,'').replace(' ','-')+'.html';
    if(window.showSaveFilePicker){
      try{
        const h=await window.showSaveFilePicker({suggestedName:snapName,id:'vplan',startIn:'documents',
                                                 types:[{description:'HTML',accept:{'text/html':['.html']}}]});
        const w=await h.createWritable(); await w.write(content); await w.close();
        toast('스냅샷 저장: '+h.name+' ('+at+')');
      }catch(e){
        if(e.name==='AbortError') return;    // cancelled picker — nothing written, nothing changed
        toast('스냅샷 실패 ('+e.name+') — 사본을 내려받습니다');
        download(snapName,content,'text/html;charset=utf-8');
      }
      return;
    }
    download(snapName,content,'text/html;charset=utf-8');
    toast('스냅샷을 내려받았습니다: '+snapName);
    return;
    // note: no markClean() on either path — the snapshot saved a copy, the working file is still behind
  }
  /* The local save helper writes the real file in place — fixed port, name from the document itself;
     it only accepts plans that already exist in ~/vplans, so a stray page cannot mint files. */
  const content=serializeDoc();
  try{
    const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),2000);
    const r=await fetch('http://127.0.0.1:8790/save?name='+encodeURIComponent(name),
                        {method:'POST',headers:{'Content-Type':'text/plain'},body:content,signal:ctl.signal});
    clearTimeout(t);
    if(r.ok){ markClean(); toast('저장됨: '+name); return; }
    toast('저장 실패 — 헬퍼 응답 '+r.status+' — 사본을 내려받습니다 (vplan-sync.sh 수동 실행으로 반영)');
  }catch(e){ toast('저장 헬퍼가 꺼져 있습니다 — 사본을 내려받습니다 (vplan-sync.sh 수동 실행으로 반영)'); }
  download(name,content,'text/html;charset=utf-8'); markClean();
}

/* Row reordering. The array order IS the order on screen, so a drop is an array splice and the
   new order is saved with the document like any other edit. Drag starts on the grip only —
   the cells are contenteditable and would otherwise drag their text instead. */
let DRAG=null;
const rowOf=e=>e.target.closest&&e.target.closest('tr.row');
const gripOf=tr=>tr&&tr.querySelector('.grip');
function clearDropMark(){ document.querySelectorAll('.drop-before,.drop-after')
  .forEach(x=>x.classList.remove('drop-before','drop-after')); }
function moveRow(arrPath,from,to){
  const a=get(arrPath); if(!a||from===to) return;
  const [row]=a.splice(from,1);
  if(to>from) to--;
  a.splice(Math.max(0,Math.min(to,a.length)),0,row);
  markDirty(); render();
}
document.addEventListener('dragstart',e=>{
  if(isSnapshot()){ e.preventDefault(); return; }   // read-only: row order is content too
  const g=e.target.closest&&e.target.closest('.grip'); if(!g) return;
  DRAG={arr:g.dataset.arr,i:+g.dataset.i};
  const tr=rowOf(e); if(tr) tr.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',g.dataset.i);   // Firefox refuses to drag without payload
});
document.addEventListener('dragover',e=>{
  const tr=rowOf(e); if(!tr||!DRAG) return;
  const g=gripOf(tr); if(!g||g.dataset.arr!==DRAG.arr) return;   // never across tables
  e.preventDefault(); e.dataTransfer.dropEffect='move';
  const r=tr.getBoundingClientRect(), after=(e.clientY-r.top)>r.height/2;
  clearDropMark(); tr.classList.add(after?'drop-after':'drop-before');
});
document.addEventListener('drop',e=>{
  const tr=rowOf(e); if(!tr||!DRAG) return;
  const g=gripOf(tr); if(!g||g.dataset.arr!==DRAG.arr) return;
  e.preventDefault();
  const r=tr.getBoundingClientRect(), after=(e.clientY-r.top)>r.height/2;
  const arr=DRAG.arr, from=DRAG.i, to=+g.dataset.i+(after?1:0);
  clearDropMark(); DRAG=null;
  moveRow(arr,from,to);
});
document.addEventListener('dragend',()=>{ clearDropMark();
  document.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging')); DRAG=null; });

/* ---- events ----------------------------------------------------------- */
document.addEventListener('input',e=>{
  if(isSnapshot()) return;                 // a snapshot is read-only: nothing writes into DATA
  const el=e.target.closest('[data-path]'); if(!el) return;
  if(el.type==='checkbox'){ set(el.dataset.path,el.checked); markDirty(); return; }
  const path=el.dataset.path, kind=el.dataset.kind;
  let v = (el.tagName==='SELECT') ? el.value : el.textContent;
  if(kind==='csv') v=v.split(',').map(s=>s.trim()).filter(Boolean);
  else if(kind!=='select'){
    const cur=get(path);
    if(typeof cur==='number' && v.trim()!=='' && !isNaN(Number(v))) v=Number(v);
  }
  set(path,v);
});
document.addEventListener('change',e=>{ if(e.target.tagName==='SELECT'&&e.target.dataset.path) render(); });

document.addEventListener('click',e=>{
  const tab=e.target.closest('[data-tab]');
  if(tab){ TAB=tab.dataset.tab; render(); return; }
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act;

  // a snapshot is read-only: viewing acts (fold, filter, sort, lint, export) stay, mutations do not
  if(isSnapshot() && ['add','del','dup','renumber','save','save-as','sug-accept','sug-reject','sug-reopen','audit-accept','audit-reject','audit-reopen','move','tog','unlink'].includes(act)){
    toast('스냅샷 파일입니다 — 수정할 수 없습니다'); return;
  }

  if(act==='toggle'){ const id=b.dataset.id; OPEN.has(id)?OPEN.delete(id):OPEN.add(id); render(); return; }
  if(act==='filter-clear'){ FILTER[b.dataset.arr]={}; render(); return; }
  if(act==='sort'){
    if(e.target.tagName==='INPUT') return;          // the category adder lives in that header
    sortRows(b.dataset.arr,b.dataset.key); return;
  }
  if(act==='tog'){
    const path=b.dataset.path, v=b.dataset.v;
    const arr=Array.isArray(get(path))?get(path):[];
    const i=arr.indexOf(v); i<0?arr.push(v):arr.splice(i,1);
    set(path,arr); markDirty(); render(); return;
  }
  if(act==='unlink'){
    const kind=b.dataset.kind;
    if(kind==='rel') relLink(b.dataset.owner,b.dataset.id,false);
    else if(kind==='vref') setLink(b.dataset.owner,b.dataset.id,false);      // feature row: drop an item
    else setLink(b.dataset.id,b.dataset.owner,false);                        // item row: drop a feature
    markDirty(); render(); return;
  }
  if(act==='add'){
    const arr=get(b.dataset.arr); arr.push(TEMPLATE[b.dataset.kind](arr)); markDirty(); render(); return;
  }
  if(act==='del'){
    const arr=get(b.dataset.arr), i=+b.dataset.i;
    const label=arr[i]&&arr[i].id?arr[i].id:'항목';
    if(confirm(label+' 삭제할까요?')){ arr.splice(i,1); markDirty(); render(); } return;
  }
  if(act==='move'){
    const arrPath=b.dataset.arr, i=+b.dataset.i, dir=+b.dataset.dir;
    const arr=get(arrPath); if(!arr) return;
    const vis=rowsOf(arrPath).map(x=>x.i);          // original indices, in the order they are shown
    const at=vis.indexOf(i), j=vis[at+dir];
    if(at<0||j==null) return;                       // already at the end of what is visible
    [arr[i],arr[j]]=[arr[j],arr[i]];                // swap, so rows hidden between them stay put
    markDirty(); render(); return;
  }
  if(act==='dup'){
    const arr=get(b.dataset.arr), i=+b.dataset.i;
    const c=JSON.parse(JSON.stringify(arr[i]));
    if(c&&c.id){ const m=String(c.id).match(/^([A-Za-z_]+)(\d+)$/); c.id = m? m[1]+String(+m[2]+1).padStart(m[2].length,'0')+'_copy' : c.id+'_copy'; }
    arr.splice(i+1,0,c); markDirty(); render(); return;
  }
  if(act==='peek'){ PEEK={kind:b.dataset.peek,id:b.dataset.id}; render(); return; }
  if(act==='peek-close'){ PEEK=null; render(); return; }
  /* Open ↗ takes you to the row itself: switch tabs, close the drawer, then bring the row into view
     after render() has replaced the DOM the old node belonged to. */
  if(act==='peek-goto'){
    const p=PEEK; if(!p) return;
    PEEK=null; TAB=p.kind==='item'?'items':'features'; render();
    requestAnimationFrame(()=>{
      const cells=[...document.querySelectorAll('.cell.id')].filter(c=>c.textContent.trim()===p.id);
      if(cells[0]) cells[0].scrollIntoView({block:'center'});
    });
    return;
  }
  if(act==='sug-group'){ const k=b.dataset.g; SUGOPEN.has(k)?SUGOPEN.delete(k):SUGOPEN.add(k); render(); return; }
  if(act==='sug-accept'){
    const s=DATA.suggestions[+b.dataset.i];
    const kind=(s.kind||'feature')==='item'?'item':'feature';
    const arr=kind==='item'?DATA.items:DATA.features;
    const f=TEMPLATE[kind](arr);
    Object.assign(f,s.payload||{});
    f.id=kind==='item'?nextId(DATA.items,'VI',3):nextId(DATA.features,'F',2);   // fresh ID — never collide
    f.status='editing';        // a card arrives with description, quote and rationale — already past 'not started'
    ['judged_by','feature_refs','related_refs'].forEach(k=>{ if(typeof f[k]==='string') f[k]=f[k].split(/[,\s|]+/).filter(Boolean); });
    arr.push(f);
    s.status='accepted'; s.accepted_as=f.id;
    markDirty(); render(); toast(`${f.id} added`);
    return;
  }
  if(act==='sug-reject'){
    const s=DATA.suggestions[+b.dataset.i];
    const k=b.dataset.k||'waived';
    s.status='rejected'; s.reject_kind=k;
    if(s.reject_reason==null) s.reject_reason='';
    markDirty(); render(); toast(`${s.sid} rejected — ${k}. Add a note on the card if you want one.`);
    return;
  }
  if(act==='sug-reopen'){
    const s=DATA.suggestions[+b.dataset.i];
    const kept=s.accepted_as;
    s.status='pending'; delete s.accepted_as; delete s.reject_kind;
    markDirty(); render();
    if(kept) toast(`${s.sid} reopened — ${kept} stays in the plan`);
    return;
  }
  /* Accepting an audit is not the same move as accepting a suggestion: a `missing` card adds a row
     (fresh id, never the proposed one), the other two EDIT the row the card names. Only the keys in
     `fix` are written, and `id` can never be one of them — a card must not rename its own target. */
  if(act==='audit-accept'){
    const a=(DATA.audits||[])[+b.dataset.i]; if(!a) return;
    const kind=(a.kind||'feature')==='item'?'item':'feature';
    const arr=kind==='item'?DATA.items:DATA.features;
    const fix={...(a.fix||{})}; delete fix.id;
    ['judged_by','feature_refs','related_refs'].forEach(k=>{ if(typeof fix[k]==='string') fix[k]=fix[k].split(/[,\s|]+/).filter(Boolean); });
    if((a.finding||'')==='missing'){
      const f=TEMPLATE[kind](arr);
      Object.assign(f,fix);
      f.id=kind==='item'?nextId(DATA.items,'VI',3):nextId(DATA.features,'F',2);
      f.status='editing';
      arr.push(f);
      a.status='accepted'; a.accepted_as=f.id;
      markDirty(); render(); toast(`${f.id} added`);
      return;
    }
    const row=arr.find(r=>r.id===a.target);
    if(!row){ toast(`${a.target||'대상 없음'} 을(를) 찾을 수 없습니다 — 적용하지 않았습니다`); return; }
    Object.assign(row,fix);
    a.status='accepted'; a.accepted_as=row.id;
    markDirty(); render(); toast(`${row.id} updated`);
    return;
  }
  if(act==='audit-reject'){
    const a=(DATA.audits||[])[+b.dataset.i]; if(!a) return;
    const k=b.dataset.k||'waived';
    a.status='rejected'; a.reject_kind=k;
    if(a.reject_reason==null) a.reject_reason='';
    markDirty(); render(); toast(`${a.aid} rejected — ${k}. Add a note on the card if you want one.`);
    return;
  }
  /* Reopen only un-decides the card. What Accept already wrote into the plan stays: undoing an edit
     would need the pre-edit values, which the card does not keep — the row is the user's now. */
  if(act==='audit-reopen'){
    const a=(DATA.audits||[])[+b.dataset.i]; if(!a) return;
    const kept=a.accepted_as;
    a.status='pending'; delete a.accepted_as; delete a.reject_kind;
    markDirty(); render();
    if(kept) toast(`${a.aid} reopened — ${kept} keeps what was applied`);
    return;
  }
  if(act==='save'){ saveHtml(); return; }
  if(act==='save-as'){ saveHtml(true); return; }
  if(act==='renumber'){ renumberIds(); return; }
  if(act==='load'){ loadSnapshot(); return; }
  if(act==='lint'){ lint(); return; }
  if(act==='lint-close'){ const l=$('.lintbox'); if(l) l.remove(); return; }
  if(act==='json'){ download(`vplan_${DATA.meta.ip_name}.json`,JSON.stringify(DATA,null,2),'application/json'); return; }
  if(act==='yaml'){ download(`vplan_${DATA.meta.ip_name}.yaml`,('# vplan '+DATA.$schema+'\n'+toYaml(DATA)).replace(/^\n/,'')); return; }
});

document.addEventListener('change',e=>{
  const f=e.target.closest('select[data-filter]');
  if(f){ filterOf(f.dataset.filter)[f.dataset.key]=f.value; render(); return; }
  const s=e.target.closest('select[data-pick]'); if(!s||!s.value) return;
  if(isSnapshot()){ toast('스냅샷 파일입니다 — 수정할 수 없습니다'); render(); return; }
  const owner=s.dataset.owner, pick=s.dataset.pick;
  if(pick==='rel')       relLink(owner,s.value,true);             // feature side: pick a command feature
  else if(pick==='vref') setLink(owner,s.value,true);             // feature side: pick an item
  else                   setLink(s.value,owner,true);             // item side: pick a feature
  markDirty(); render();
});

document.addEventListener('keydown',e=>{
  const inp=e.target.closest('input[data-newopt]');
  if(inp){
    if(e.key==='Escape'){ inp.value=''; inp.blur(); return; }
    if(e.key!=='Enter') return;
    e.preventDefault();
    if(isSnapshot()){ toast('스냅샷 파일입니다 — 수정할 수 없습니다'); return; }
    const key=inp.dataset.newopt, v=inp.value.trim();
    if(!v) return;
    const list=DATA.$enums[key]||(DATA.$enums[key]=[]);
    if(!list.includes(v)){ list.push(v); markDirty(); }
    inp.value=''; render(); toast(`${key}: "${v}" added`);
    return;
  }
  if(e.key==='Escape'&&PEEK){ PEEK=null; render(); return; }
  if((e.metaKey||e.ctrlKey)&&(e.key==='s'||e.key==='S')){ e.preventDefault(); saveHtml(e.shiftKey); }
});
window.addEventListener('beforeunload',e=>{ if(DIRTY){ e.preventDefault(); e.returnValue=''; } });

render();
</script>
