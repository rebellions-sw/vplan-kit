<!DOCTYPE html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verification Plan</title>
<!--
=====================================================================================
 VPLAN — Single-file Verification Plan  (schema: vplan/1.0, methodology: UVM/SystemVerilog)
=====================================================================================

 [ HUMAN ]
   Open this file in CHROME. Every field is editable in place. Saving in place needs the File System
   Access API, which Safari does not have — there, every save downloads a copy instead and this file
   never changes. The label beside the Save button says which mode you are in.
   Ctrl/Cmd+S  = save. No dialog, ever: the page posts itself to the local vplan-save helper
   (127.0.0.1), which writes ~/vplans/vplan_<IP>.html in place. If the helper is down, the save
   falls back to a download — run vplan-sync.sh by hand to ingest those.
   Ctrl/Cmd+Shift+S = save as — write a dated SNAPSHOT copy. A snapshot reopened is READ-ONLY:
   no Save buttons (the stamp of when it was made sits in their place), no editing, no row moves —
   the original stays the one and only place the plan changes.
   Load (originals only) = pull a snapshot file back onto the screen; press Save to make it real.
   The Suggestions from AI panel under Features / Verification Items holds gap analyses written here by
   Claude Code. Nothing lands in the plan until a human
   reads the MAS evidence on the card and clicks Accept.

 [ AI EDITING CONTRACT ]  <-- read this before modifying the file programmatically
   1. The ONLY source of truth is the JSON inside  <script id="vplan-data" type="application/json">.
      Everything else in this file is a renderer. Never hand-edit the rendered DOM.
   2. To edit: parse that JSON, mutate it, write it back into the same <script> block.
      Do not reformat or restructure the surrounding HTML/JS.
   3. IDs (`id` fields) are stable primary keys. Never renumber one yourself — only the UI's Refresh
      button does that, and it rewrites every reference in the same pass.
      New IDs: features F##, verification items VI###, testcases TC###, coverage CG##, assertions SVA##.
   3b. `suggestions[]` is the agent's inbox, NOT the plan. An agent may APPEND to it and may set
      `status` only on entries it created. It must never write into `features[]` / `testcases[]` /
      `coverage` directly on the strength of a suggestion — the human accepts it in the UI.
      Each entry needs: sid (S###), kind, status (pending|accepted|rejected), confidence, created,
      source{doc,section,url,quote}, rationale, payload{...the object being proposed...}.
      `quote` must be text actually present in the source document. Do not paraphrase it.
      Before proposing, read entries with status "rejected": `reject_kind` says why —
      duplicated (the plan already had it: match harder), hallucinated (the claim did not hold:
      quote more strictly), waived (a project decision, nothing to fix) — and `reject_reason` adds
      detail. Never propose a rejected item again.
   4. Cross references are by ID string:
        testcases[].feature_refs[]   -> features[].id
        testcases[].coverage_refs[]  -> coverage.functional[].id | coverage.assertions[].id
        coverage.functional[].feature_refs[] -> features[].id
      Keep them consistent. The "Lint" button in the UI checks this.
   5. Enum values are fixed. See `$enums` at the top of the JSON.
   6. Free-text fields accept Markdown-ish plain text. No HTML.

 [ TESTBENCH GENERATION CONTRACT ]
   A generator should be able to emit a full UVM TB from this JSON alone:
     testcases[].uvm      -> uvm_test class, base test, virtual sequence, per-agent sequences
                             (the agent inventory is the set of `sequences[].agent` names used anywhere)
     testcases[].config   -> plusargs & uvm_config_db settings for that test
     testcases[].checks   -> what the scoreboard / assertion / RAL must verify (`ref` names the component)
     testcases[].tb_gen_hints -> TB-side requirements not visible in any other field
     coverage.functional  -> covergroup skeletons (covergroup / sample_point / bins)
     coverage.assertions  -> SVA property skeletons (bind target in `module`)
     testcases[].seeds    -> seed count per test for the regression runner
   The env / agent / scoreboard structure is DERIVED, not stored here: the agent list comes from
   testcases[].uvm.sequences[].agent, scoreboard & model component names come from checks[].ref, and the
   base test / virtual sequence names come from testcases[].uvm. Keep those names spelled consistently —
   a typo creates a phantom agent. The Lint button reports every distinct agent name it finds.
   NOTE: this plan does not describe the DUT pin interfaces (protocol, widths, clocks). The generator must
   take those from the RTL or the spec; it cannot invent them from this file.
   Use the "Copy TB Context" toolbar button to copy this subset plus a ready-made prompt.
=====================================================================================
-->
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel-2:#fbfcfd; --ink:#16191d; --ink-2:#5b6470;
  --line:#e2e6eb; --line-2:#eef1f4; --accent:#2f6feb; --accent-soft:#e8f0fe;
  --ok:#1a7f4b; --ok-bg:#e6f4ec; --warn:#9a6200; --warn-bg:#fdf1dd;
  --err:#b4232a; --err-bg:#fceceb; --mut:#6b7280; --mut-bg:#eef0f3;
  --row-head:#f4f6f8;
  --radius:8px; --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1115; --panel:#171a20; --panel-2:#1c2027; --ink:#e6e9ee; --ink-2:#a3acb9;
    --line:#2a2f38; --line-2:#232830; --accent:#6aa0ff; --accent-soft:#1b2740;
    --ok:#5cc98f; --ok-bg:#12291d; --warn:#e0aa5a; --warn-bg:#2c2213;
    --err:#f08a86; --err-bg:#2e1717; --mut:#8b93a1; --mut-bg:#232830;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:1400px;margin:0 auto;padding:0 20px 80px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:var(--bg);padding:14px 0 0;border-bottom:1px solid var(--line)}
.topbar-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.title{font-size:17px;font-weight:650;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.title .ver{font:400 12px/1 var(--mono);color:var(--mut)}
.metastrip{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:9px}
.ms-item{display:flex;align-items:center;gap:6px}
.ms-item > b{font-weight:600;font-size:10px;line-height:1;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.ms-item > b.asis{text-transform:none}
.ms-item a{color:var(--accent);text-decoration:none;font-weight:600;font-size:11px}
/* Input SRC block — one grid so both rows line up on every column */
.srchead{margin:10px 0 4px;font-weight:600;font-size:10px;line-height:1;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.srcbox{display:grid;grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center;gap:5px 9px;padding:7px 10px;background:var(--panel-2);
  border:1px solid var(--line-2);border-radius:var(--radius)}
.src-k{font-size:11px;font-weight:600;line-height:1;color:var(--accent);background:var(--accent-soft);
  border-radius:999px;padding:4px 8px;white-space:nowrap;text-align:center}
.cell.src-v{word-break:break-all;background:transparent}
.cell.src-v:hover{background:var(--panel-2)}
.src-go{color:var(--accent);text-decoration:none;font-weight:600;font-size:12px;padding:0 2px}
/* row reordering */
.tbd{font-size:9.5px;font-weight:700;color:var(--mut);opacity:.75;letter-spacing:.04em;vertical-align:1px}
.foldbox{margin-top:14px}
.foldbox > .sug-fold{margin-top:0}
.sug-fold{display:flex;align-items:center;gap:8px;margin-top:10px;padding:7px 10px;cursor:pointer;
  border:1px solid var(--line);border-radius:6px;background:var(--panel-2);user-select:none}
.sug-fold:hover{border-color:var(--accent)}
.sug-fold > b{font-size:11.5px;font-weight:700;color:var(--ink-2)}
.sug-fold .caret{color:var(--mut);font-size:11px}
.sug-fold .hint{margin-left:auto;color:var(--mut);font-size:10.5px}
td > select.cell{width:100%}
select.cell.phase{min-width:128px}
.refcell{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
/* Verified by | Related to — split down the middle, independent of the table's column widths */
.halfrow{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:900px){.halfrow{grid-template-columns:1fr}}
.reflink{display:inline-flex;align-items:center;gap:3px;padding:2px 4px 2px 7px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);font:600 11px/1.5 var(--mono);white-space:nowrap;max-width:100%}
.reflink > .peek{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reflink > .peek.flat{cursor:default;text-decoration:none}
.reflink > .x{border:none;background:none;cursor:pointer;color:var(--accent);opacity:.55;font:700 12px/1 inherit;padding:0 2px}
.reflink > .x:hover{opacity:1}
.reflink > .peek{border:none;background:none;cursor:pointer;color:inherit;font:inherit;padding:0;text-decoration:underline;
  text-decoration-color:transparent;text-underline-offset:2px}
.reflink > .peek:hover{text-decoration-color:currentColor}
/* Peek drawer: overlaps the table on the right rather than pushing it, so the row you came from
   stays where it was. Fixed to the viewport, under the top bar, never wider than the screen. */
.peek-pane{position:fixed;right:16px;top:calc(var(--topbar-h,60px) + 12px);z-index:60;
  width:min(420px,calc(100vw - 32px));max-height:calc(100vh - var(--topbar-h,60px) - 28px);
  display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:0 12px 40px rgba(0,0,0,.18)}
.peek-head{display:flex;align-items:center;gap:8px;padding:9px 10px 9px 12px;border-bottom:1px solid var(--line-2);
  background:var(--panel-2);border-radius:var(--radius) var(--radius) 0 0}
.peek-body{padding:12px;overflow-y:auto}
.peek-name{font-weight:650;font-size:14px;line-height:1.35;margin-bottom:10px}
.peek-line{display:grid;grid-template-columns:88px 1fr;gap:8px;padding:5px 0;border-top:1px solid var(--line-2);font-size:12.5px}
.peek-line > b{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding-top:2px}
.peek-line > span{overflow-wrap:anywhere;white-space:pre-wrap}
@media print{.peek-pane{display:none!important}}
select.cell.picker{min-width:46px;width:46px;padding-right:18px;color:var(--accent);cursor:pointer}
tr.subrow > td{border-top:none;padding-top:0;padding-bottom:2px;background:var(--panel-2)}
tr.row + tr.subrow > td{padding-top:7px}   /* row 1 ends in selects; the labels below need a little air */
/* the first row of a block is its header line — a shade darker than the three that hang off it */
tr.row > td{border-top:2px solid var(--line);background:var(--row-head)}
tbody tr:first-child > td{border-top:none}
tr.subrow > td:nth-child(3){border-left:2px solid var(--line-2)}
tr.subrow:last-of-type > td{padding-bottom:9px}
tr.row:hover > td{background:var(--mut-bg)}
tr.row:hover + tr.subrow > td{background:var(--panel)}
tr.subrow .field{gap:3px;margin:2px 0 6px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* both rows share one template, so Stimulus lines up under Judged by at the same width;
   the right-hand field hugs the right edge so the two line up there too */
.pair2{display:grid;grid-template-columns:2fr 1fr;gap:12px;align-items:start}
tr.subrow > td > .field{margin-right:12px}
.togs{display:flex;flex-wrap:wrap;gap:4px;padding:3px 0}
.tog{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 9px;
  font:600 11px/1 var(--mono);color:var(--mut);cursor:pointer}
.tog:hover{border-color:var(--accent);color:var(--accent)}
.tog.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.headfilter{display:inline-flex;align-items:center;gap:5px}
.headfilter > b{font-size:9.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
select.cell.mini.on{border-color:var(--accent);color:var(--accent);font-weight:700}
tr.subrow .field > label{font-size:9.5px;letter-spacing:.06em}
.cell.boxed{border-color:var(--line-2);min-height:32px;padding:6px 8px;line-height:1.5}
.cell.boxed:hover{border-color:var(--line)}
tr.subrow .noteline{display:flex;align-items:center;gap:8px}
/* the notes-row buttons line up with the Verified by column's left edge, not the row's right end
   (td.actions is right-aligned everywhere else, and width:1% would shrink the cell away here) */
tr.subrow > td.actions{padding-top:0;text-align:left;width:auto}
td.ctr{text-align:center}
input.chk.rowsel{margin-right:2px}
input.chk{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;margin:0}
td.gripcell{padding:4px 0 4px 4px;width:1%;white-space:nowrap;vertical-align:middle}
tr.subrow .noteline > b{font-size:9.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
tr.subrow .noteline > .cell{flex:1}
.foldbox > .sug-fold + .sug-fold{margin-top:6px}
.grip{cursor:grab;color:var(--mut);opacity:.5;padding:0 3px;font-size:13px;line-height:1;user-select:none}
.grip:hover{opacity:1}
.grip:active{cursor:grabbing}
/* a snapshot (Save As copy) is read-only: every control that would change content disappears;
   state-bearing controls (selects, checkboxes, link chips) stay visible but inert */
#app.snap .grip,#app.snap #dirty,
#app.snap [data-act="add"],#app.snap [data-act="del"],#app.snap [data-act="dup"],
#app.snap [data-act="renumber"],#app.snap [data-act="sug-accept"],#app.snap [data-act="sug-reject"],
#app.snap [data-act="sug-reopen"],
#app.snap [data-act="audit-accept"],#app.snap [data-act="audit-reject"],
#app.snap [data-act="audit-reopen"]{display:none!important}
tr.row.dragging{opacity:.4}
tr.row.drop-before > td{box-shadow:inset 0 2px 0 0 var(--accent)}
tr.row.drop-after  > td{box-shadow:inset 0 -2px 0 0 var(--accent)}
.cell.mini{padding:2px 6px;min-height:22px;font-size:12.5px}
/* .cell.mini (two classes) outranks select.cell (one class + element), so its 6px padding was
   winning and the arrow was drawn straight over the text. Restore room for the arrow here. */
select.cell.mini{background-position:calc(100% - 12px) 9px,calc(100% - 8px) 9px;
  padding-right:22px;min-width:96px}
.cell.t-ip{font-weight:650;font-size:17px;line-height:1.3;letter-spacing:-.01em;padding:1px 7px;background:transparent}
.cell.t-ip:hover{background:var(--panel-2)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 11px;border-radius:6px;
  font-weight:500;font-size:12.5px;line-height:1.4;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.sm{padding:3px 8px;font-size:11.5px}
.btn.icon{padding:3px 7px;color:var(--mut)}
.dirty{font:600 11px/1 var(--mono);color:var(--warn);background:var(--warn-bg);padding:4px 7px;border-radius:5px;visibility:hidden}
.dirty.on{visibility:visible}
.savetgt{font-family:var(--mono);font-size:10px;color:var(--ink-3);white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.savetgt.warn{color:var(--warn)}
.tabs{display:flex;gap:2px;margin-top:12px;overflow-x:auto}
.tab{padding:8px 13px;border:none;background:none;color:var(--ink-2);font-weight:500;font-size:13px;line-height:1;cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab .cnt{font:400 11px var(--mono);color:var(--mut);margin-left:5px}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-top:16px;overflow:hidden}
.panel-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-2);background:var(--panel-2)}
.panel-head h2{margin:0;font-size:13px;font-weight:650;letter-spacing:.01em}
.panel-head .hint{font-size:11.5px;color:var(--mut)}
.panel-body{padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field > label{font-weight:600;font-size:11px;line-height:1.3;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.field .sub{font-size:11px;color:var(--mut);font-weight:400;text-transform:none;letter-spacing:0}

/* ---------- editable cells ---------- */
.cell{border:1px solid transparent;border-radius:5px;padding:4px 6px;min-height:26px;background:var(--panel-2);
  white-space:pre-wrap;word-break:break-word;outline:none}
.cell:hover{border-color:var(--line)}
.cell:focus{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft)}
.cell:empty::before{content:attr(data-ph);color:var(--mut);opacity:.75}
.cell.mono{font-family:var(--mono);font-size:12.5px}
.cell.id{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent);background:transparent}
select.cell{appearance:none;padding-right:20px;
  background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);
  background-position:calc(100% - 12px) 11px,calc(100% - 8px) 11px;background-size:4px 4px;background-repeat:no-repeat;
  font:inherit;color:inherit;cursor:pointer}
select.cell:focus{box-shadow:0 0 0 3px var(--accent-soft)}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse}
thead th{vertical-align:top;background:var(--mut-bg);border-bottom:2px solid var(--line);
  padding-top:8px;padding-bottom:7px}
th{text-align:left;font-weight:700;font-size:11.5px;line-height:1.3;color:var(--ink-2);text-transform:uppercase;letter-spacing:.07em;
  padding:8px 8px;border-bottom:1px solid var(--line);background:var(--panel-2);position:sticky;top:0}
td{padding:4px 6px;vertical-align:top}   /* no per-row rule: blocks are separated by tr.row's top border */
td.actions{white-space:nowrap;text-align:center;width:1%}
th.th-confirm{text-align:center}
/* one segmented group, flush with the column's left edge: the cell drops td's own padding, borders are
   shared (a negative margin collapses the doubled 1px seam), and only the outer corners are rounded */
td.idbtns-cell{padding-left:0}
.idbtns{display:flex;gap:0;margin-top:3px}
.idbtns > .btn.icon{border-radius:0;margin-left:-1px}
.idbtns > .btn.icon:first-child{border-radius:5px 0 0 5px;margin-left:0}
.idbtns > .btn.icon:last-child{border-radius:0 5px 5px 0}
.idbtns > .btn.icon:hover{position:relative;z-index:1}   /* the hovered border on top of its neighbours */
.idbtns > .btn.icon[disabled]{opacity:.25;cursor:default}
/* an audit card's before → after pair: the row as it stands, then the editable proposal */
.afix{display:grid;grid-template-columns:minmax(140px,1fr) 2fr;gap:10px;align-items:start;margin-top:6px}
.afix-was{font-size:12px;color:var(--ink-3);padding-top:16px;overflow-wrap:anywhere}
.afix-was b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin-bottom:2px}
@media (max-width:820px){.afix{grid-template-columns:1fr}.afix-was{padding-top:0}}
#app.snap .idbtns{display:none}
select.thfilter{display:block;margin-top:3px;width:100%;font:inherit;font-size:10px;text-transform:none;
  letter-spacing:0;color:var(--ink-2);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:2px 4px}
select.thfilter.on{border-color:var(--accent);color:var(--accent);font-weight:700}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--accent)}
.scaret{margin-left:4px;font-size:8px;color:var(--accent)}
th > input.newopt{margin-left:6px;width:52px;border:1px solid var(--line);border-radius:4px;background:var(--panel);
  font:inherit;font-size:9.5px;padding:2px 4px;text-transform:none;letter-spacing:0;color:var(--ink)}
th > input.newopt:focus{border-color:var(--accent);outline:none}
.tbl-wrap{overflow-x:auto}
.tbl-wrap > table{min-width:1120px}
/* Features / Verification items are the long tables — their panel head (with + add) and column row
   stay pinned under the top bar while the page scrolls. Sticky resolves against the nearest scroll
   container, so these two panels must not create one: no overflow on the panel or its table wrap.
   The trade is that a window narrower than the table scrolls the page sideways instead of the wrap.
   The offsets are measured, not guessed — --topbar-h / --head-h are written by stickTops(). */
.panel.stick,.panel.stick > .tbl-wrap{overflow:visible}
.panel.stick > .panel-head{position:sticky;top:var(--topbar-h,0px);z-index:30}
.panel.stick thead th{position:sticky;top:calc(var(--topbar-h,0px) + var(--head-h,0px));z-index:20}
th{white-space:nowrap}
.cell.id{white-space:nowrap}
.cell.nw{white-space:nowrap}

/* ---------- expandable detail ---------- */
.exp{cursor:pointer;user-select:none;color:var(--mut);font:600 13px/1.6 var(--mono);width:1%;padding:4px 2px 4px 8px}
.exp:hover{color:var(--accent)}
tr.detail > td{background:var(--panel-2);padding:14px 18px;border-bottom:2px solid var(--line)}
.sub-panel{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:10px 12px;margin-top:10px}
.sub-panel > h4{margin:0 0 8px;font-weight:600;font-size:11px;line-height:1;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;
  display:flex;align-items:center;gap:8px}

/* ---------- badges ---------- */
.badge{display:inline-block;padding:2px 7px;border-radius:99px;font:600 10.5px/1.6 var(--mono);letter-spacing:.02em}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:var(--warn)}
.b-err{background:var(--err-bg);color:var(--err)} .b-mut{background:var(--mut-bg);color:var(--mut)}
.b-acc{background:var(--accent-soft);color:var(--accent)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{border:1px solid var(--line);border-radius:6px;padding:8px 12px;background:var(--panel-2);min-width:96px}
.stat .n{font:650 19px/1.2 var(--mono)} .stat .l{font-size:11px;color:var(--mut)}

/* ---------- misc ---------- */
.chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.note{font-size:12px;color:var(--mut);margin:0 0 10px}
.lintbox{margin-top:16px}
/* ---------- suggestion cards ---------- */
.sug{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);margin-bottom:12px;overflow:hidden}
.sug.done{opacity:.62}
.sug-head{display:flex;align-items:center;gap:8px;padding:9px 13px;background:var(--panel-2);border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.sug-head .sid{font:600 12px/1 var(--mono);color:var(--accent)}
.sug-body{padding:12px 13px;display:grid;gap:11px}
.sug-name{font-size:14.5px;font-weight:640;letter-spacing:-.01em}
.evi{border-left:3px solid var(--accent);background:var(--panel-2);border-radius:0 6px 6px 0;padding:8px 11px;display:grid;gap:5px}
.evi-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;font-size:11px;line-height:1.3;color:var(--mut)}
.evi-q{font-size:12.5px;font-style:italic;color:var(--ink-2);border-left:2px solid var(--line);padding-left:9px}
.evi a{color:var(--accent);text-decoration:none;font-weight:600;font-size:11.5px}
.evi a:hover{text-decoration:underline}
.why{font-size:12.5px;color:var(--ink-2)}
.why > b{color:var(--mut);font-weight:600;font-size:10.5px;line-height:1;text-transform:uppercase;letter-spacing:.05em;margin-right:6px}
.sug-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.sug-wide{display:grid;gap:10px}
.filterbar{display:flex;gap:6px;align-items:center}
.lint-sec{margin-bottom:14px}
.lint-sec:last-child{margin-bottom:0}
.lint-sec-head{display:flex;align-items:center;gap:7px;padding:5px 0 6px;border-bottom:2px solid var(--line)}
.lint-group{display:flex;gap:9px;padding:7px 0 7px 6px;border-bottom:1px solid var(--line-2);align-items:flex-start}
.lint-sec > .lint-group:last-child{border-bottom:none}
.lg-body{flex:1;min-width:0}
.lg-title{font-size:12.5px;font-weight:400;margin-bottom:5px}
.scope{font-weight:800;font-size:10px;line-height:1.4;text-transform:uppercase;letter-spacing:.12em;margin-right:6px}
.s-feature,.s-item,.s-plan{color:var(--ink-2)}
.lg-n{color:var(--mut);font-weight:600}
.lg-title .hint{font-weight:400;margin-left:6px}
.lint-item{display:flex;gap:9px;padding:6px 0;border-bottom:1px solid var(--line-2);font-size:12.5px;align-items:baseline}
.lint-item:last-child{border-bottom:none}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:7px;font-size:13px;z-index:200;opacity:0;transition:opacity .18s;pointer-events:none}
.toast.on{opacity:1}
@media print{.topbar,.actions,.btn,.exp{display:none!important} .panel{break-inside:avoid} body{background:#fff}}
</style>
</head>
<body>

    },
    "assertions": [],
    "signoff_criteria": "Code coverage targets met, all functional covergroups at target, 0 open P0/P1 bugs, regression green for 2 consecutive runs, all coverage exclusions signed off."

<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================================
   vplan renderer / editor.  Source of truth = #vplan-data JSON.
   ==========================================================================*/
"use strict";

let DATA = JSON.parse(document.getElementById('vplan-data').textContent);
let TAB  = 'features';
const SUGOPEN = new Set();   // '<kind>:accepted' | '<kind>:rejected' — open fold groups
let PEEK = null;             // {kind:'item'|'feature', id} — the row the peek drawer is showing
let OPEN = new Set();          // expanded testcase ids
let DIRTY = false;

const E   = DATA.$enums;
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $   = s => document.querySelector(s);

function get(path){ return path.split('.').reduce((o,k)=>(o==null?o:o[k]), DATA); }
function set(path,val){
  const ks=path.split('.'), last=ks.pop();
  let o=DATA; for(const k of ks) o=o[k];
  o[last]=val; markDirty();
}
function markDirty(){ DIRTY=true; const d=$('#dirty'); if(d) d.classList.add('on'); }
function markClean(){ DIRTY=false; const d=$('#dirty'); if(d) d.classList.remove('on'); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),1900); }

/* ---- editable widgets ------------------------------------------------- */
function cell(path,{ph='',cls='',kind='text'}={}){
  let v = get(path);
  if(kind==='csv') v = Array.isArray(v)? v.join(', ') : (v||'');
  return `<div class="cell ${cls}" contenteditable="${isSnapshot()?'false':'plaintext-only'}" spellcheck="false"
            data-path="${path}" data-kind="${kind}" data-ph="${esc(ph)}">${esc(v)}</div>`;
}
function sel(path,opts,{cls=''}={}){
  const v = get(path);
  const o = opts.map(x=>`<option value="${esc(x)}"${x===v?' selected':''}>${esc(x)}</option>`).join('');
  const extra = opts.includes(v)?'':`<option value="${esc(v)}" selected>${esc(v)}</option>`;
  return `<select class="cell ${cls}"${isSnapshot()?' disabled':''} data-path="${path}" data-kind="select">${extra}${o}</select>`;
}
function field(label,inner,sub){
  return `<div class="field"><label>${esc(label)}${sub?` <span class="sub">${esc(sub)}</span>`:''}</label>${inner}</div>`;
}
function statusBadge(v){
  const m={passing:'b-ok',coded:'b-acc',in_progress:'b-warn',failing:'b-err',blocked:'b-err',waived:'b-mut',planned:'b-mut',
           closed:'b-ok',open:'b-warn',in_review:'b-warn',high:'b-err',med:'b-warn',low:'b-mut'};
  return `<span class="badge ${m[v]||'b-mut'}">${esc(v)}</span>`;
}
/* The link between a feature and a verification item is stored once, on items[].feature_refs.
   Both tables edit that same list — the feature side just writes it from the other end. */
/* a fixed, short option set: show every option and let a click toggle it — no hidden state, no popup */
function togChips(path,values,cur){
  const on=new Set(cur||[]);
  return `<div class="togs">${values.map(v=>`<button class="tog${on.has(v)?' on':''}" data-act="tog"
    data-path="${path}" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div>`;
}
/* Two kinds of chip. `Verified by` / `Link to` are the verification wiring: they show the id, which is
   what the rest of the plan cites, and clicking one opens the peek drawer on that row. `Related to` is
   read, not chased — it shows the command's name and is plain text, since the name IS the information.
   Both keep the × that unlinks; an unnamed or deleted row falls back to its id so no chip is blank. */
function refChips(kind,ownerId,ids){
  if(!ids.length) return `<span class="badge b-mut">none</span>`;
  const peek=kind==='vref'?'item':'feature';
  return ids.map(id=>{
    const row=(peek==='item'?DATA.items:DATA.features).find(r=>r.id===id);
    const gone=row?'':' — 플랜에 없음';
    const x=`<button class="x" data-act="unlink" data-kind="${kind}"
      data-owner="${esc(ownerId)}" data-id="${esc(id)}" title="unlink">×</button>`;
    if(kind==='rel'){
      const label=(row&&row.name&&row.name.trim())?row.name.trim():id;
      return `<span class="reflink"><span class="peek flat" title="${esc(id)}${gone}">${esc(label)}</span>${x}</span>`;
    }
    return `<span class="reflink"><button class="peek" data-act="peek" data-peek="${peek}"
      data-id="${esc(id)}" title="${esc(id)}${gone} · 내용 보기">${esc(id)}</button>${x}</span>`;
  }).join('');
}
function linkPicker(kind,ownerId,rows,label){
  if(!rows.length || isSnapshot()) return '';   // read-only snapshot: no way to add a link
  return `<select class="cell mini picker" data-pick="${kind}" data-owner="${esc(ownerId)}">
      <option value="">${esc(label)}</option>
      ${rows.map(r=>`<option value="${esc(r.id)}">${esc(r.id)}${r.name?' · '+esc(r.name.slice(0,28)):''}</option>`).join('')}
    </select>`;
}
/* One-way, and the id is kept even if that feature's category later changes — data is data; lint
   is what points out a link that no longer cites a command feature. */
function relLink(featureId,targetId,on){
  const f=DATA.features.find(x=>x.id===featureId); if(!f||featureId===targetId) return;
  const refs=new Set(f.related_refs||[]);
  on?refs.add(targetId):refs.delete(targetId);
  f.related_refs=[...refs];
}
function setLink(featureId,itemId,on){
  const it=DATA.items.find(x=>x.id===itemId); if(!it) return;
  const refs=new Set(it.feature_refs||[]);
  on?refs.add(featureId):refs.delete(featureId);
  it.feature_refs=[...refs];
}
/* The category list is one shared enum. It is edited where it is used — type a name in the column
   header and press Enter — so a new classification never needs a trip into the JSON. */
/* Sorting rewrites the array, it does not just reorder the view — in this file the array order IS the
   order on screen (that is what drag-to-reorder edits), so a sorted view that disagreed with it would
   make a drop land somewhere else. Enum columns sort by the order declared in $enums, not alphabetically. */
const SORT={};
/* Category / Phase / Definition are filters, not sorts: pick a value and only those rows render.
   Rows keep their real array index so every data-path still points at the right record. */
const FILTER={};
function filterOf(arrPath){ return FILTER[arrPath]||(FILTER[arrPath]={}); }
function rowsOf(arrPath){
  const f=filterOf(arrPath);
  return (get(arrPath)||[]).map((r,i)=>({r,i})).filter(({r})=>{
    if(!['category','phase','status'].every(k=>!f[k]||r[k]===f[k])) return false;
    if(f.vref){                       // features, filtered by the item that verifies them
      const linked=DATA.items.filter(it=>(it.feature_refs||[]).includes(r.id)).map(it=>it.id);
      return f.vref==='__none__' ? !linked.length : linked.includes(f.vref);
    }
    if(f.fref){                       // items, filtered by the feature they belong to
      const refs=r.feature_refs||[];
      return f.fref==='__none__' ? !refs.length : refs.includes(f.fref);
    }
    return true;
  });
}
function filterTh(label,arrPath,key,enumKey,style){
  return filterThList(label,arrPath,key,(DATA.$enums[enumKey]||[]).map(v=>[v,v]),style);
}
function filterThList(label,arrPath,key,pairs,style){
  const cur=filterOf(arrPath)[key]||'';
  const opts=pairs.map(([v,t])=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(t)}</option>`).join('');
  return `<th style="${style}">${label}
    <select class="thfilter${cur?' on':''}" data-filter="${arrPath}" data-key="${key}">
      <option value="">all</option>${opts}</select></th>`;
}
function headFilter(label,arrPath,key,pairs){
  const cur=filterOf(arrPath)[key]||'';
  return `<span class="headfilter"><b>${esc(label)}</b>
    <select class="cell mini${cur?' on':''}" data-filter="${arrPath}" data-key="${key}">
      <option value="">all</option>
      ${pairs.map(([v,t])=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(t)}</option>`).join('')}
    </select></span>`;
}
function filterNote(arrPath){
  const f=filterOf(arrPath), on=Object.keys(f).filter(k=>f[k]);
  if(!on.length) return '';
  return `<button class="btn sm" data-act="filter-clear" data-arr="${arrPath}">clear filter</button>
    <span class="badge b-warn">filtered: ${rowsOf(arrPath).length} / ${(get(arrPath)||[]).length}</span>`;
}
function sortTh(label,arrPath,key,style){
  const st=SORT[arrPath]||{};
  const caret=st.key===key?(st.dir>0?'▲':'▼'):'';
  return `<th style="${style}" class="sortable" data-act="sort" data-arr="${arrPath}" data-key="${key}">${label}<span class="scaret">${caret}</span></th>`;
}
function sortRows(arrPath,key){
  const arr=get(arrPath); if(!Array.isArray(arr)) return;
  const st=SORT[arrPath]||(SORT[arrPath]={key:null,dir:1});
  st.dir=st.key===key?-st.dir:1; st.key=key;
  const rank=(enumKey,v)=>{ const e=DATA.$enums[enumKey]||[]; const i=e.indexOf(v); return i<0?e.length:i; };
  const val=r=>{
    if(key==='id') return String(r.id||'').padStart(12,'0');
    if(key==='category') return String(rank('category',r.category)).padStart(3,'0');
    if(key==='phase') return String(rank('phase',r.phase)).padStart(3,'0');
    if(key==='status') return String(rank('status',r.status)).padStart(3,'0');
    return '';
  };
  arr.sort((a,b)=>{
    const x=val(a),y=val(b);
    if(x!==y) return (x<y?-1:1)*st.dir;
    return String(a.id||'').localeCompare(String(b.id||''))*st.dir;   // stable tiebreak
  });
  markDirty(); render();
}
function catHead(){
  return `Category<input class="newopt" data-newopt="category" placeholder="+ add" title="이름을 쓰고 Enter">`;
}
function rowGrip(arrPath,i){
  return `<span class="grip" draggable="true" data-arr="${arrPath}" data-i="${i}" title="드래그해서 순서 이동">⠿</span>`;
}
/* One checkbox per row — the Confirmed column. It still writes `reviewed`: renaming the field would
   ripple through the schema and every existing plan for a label's sake. */
function confirmCk(arrPath,i){
  const reviewed=((get(arrPath)||[])[i]||{}).reviewed;
  return `<input type="checkbox" class="chk rowsel"${isSnapshot()?' disabled':''} data-path="${arrPath}.${i}.reviewed"${reviewed?' checked':''} title="확정">`;
}
/* dup/del/move live under the ID value in the Features / Verification Items tables. `vi` is the row's
   place in the VISIBLE list and `n` its length — the ends are disabled rather than silently doing
   nothing, and a filtered-out row never becomes an invisible obstacle to step over. */
function rowDupDel(arrPath,i,vi,n){
  const mv=(dir,label,ch)=>`<button class="btn icon" data-act="move" data-arr="${arrPath}" data-i="${i}"
      data-dir="${dir}" title="${label}"${(dir<0?vi===0:vi===n-1)?' disabled':''}>${ch}</button>`;
  return `${mv(-1,'위로 이동','↑')}${mv(1,'아래로 이동','↓')}
    <button class="btn icon" data-act="dup" data-arr="${arrPath}" data-i="${i}" title="복제">⧉</button>
    <button class="btn icon" data-act="del" data-arr="${arrPath}" data-i="${i}" title="삭제">✕</button>`;
}
/* testcases / coverage rows keep the old combined trailing cell: grip + checkbox + dup/del. */
function rowCtrls(arrPath,i){ return rowGrip(arrPath,i)+confirmCk(arrPath,i)+rowDupDel(arrPath,i); }
function rowBtns(arrPath,i){ return `<td class="actions">${rowCtrls(arrPath,i)}</td>`; }
function addBtn(arrPath,kind,label){ return `<button class="btn sm" data-act="add" data-arr="${arrPath}" data-kind="${kind}">+ ${esc(label)}</button>`; }

/* ---- shell ------------------------------------------------------------ */
const TABS=[
  ['features','Features',   ()=>DATA.features.length],
  ['items','Verification Items',()=>DATA.items.length],
  ['testcases','Testcases <span class="tbd">[TBD]</span>', ()=>DATA.testcases.length],
  ['coverage','Coverage <span class="tbd">[TBD]</span>',()=>DATA.coverage.functional.length+DATA.coverage.assertions.length],
];

function render(){
  $('#app').classList.toggle('snap',isSnapshot());   // read-only dress: CSS hides every mutating control
  const tabs=TABS.map(([k,l,c])=>{const n=c();return `<button class="tab${TAB===k?' active':''}" data-tab="${k}">${l}${n!=null?`<span class="cnt">${n}</span>`:''}</button>`}).join('');
  $('#app').innerHTML=`
  <div class="topbar">
    <div class="topbar-row">
      <div class="title">${cell('meta.ip_name',{cls:'t-ip',ph:'IP_NAME'})}
        <span class="ver">Verification Plan · ${esc(DATA.$schema)}</span></div>
      <span class="dirty" id="dirty">UNSAVED</span>
      <div class="spacer"></div>
      <button class="btn" data-act="renumber" title="ID를 목록 순서대로 다시 부여하고 참조를 함께 고칩니다">Refresh</button>
      <button class="btn" data-act="lint">Lint</button>
      <button class="btn" data-act="json">Export JSON</button>
      <button class="btn" data-act="yaml">Export YAML</button>
      <span class="savetgt" id="save-target" title="${isSnapshot()?'이 스냅샷이 저장된 시각':'Save가 덮어쓸 파일'}"></span>${isSnapshot()?'':`
      <button class="btn" data-act="load" title="스냅샷 파일을 불러와 화면에 올립니다 — 파일에 반영하려면 Save">Load</button>
      <button class="btn" data-act="save-as" title="지금 상태를 날짜 찍힌 스냅샷 사본으로 저장합니다 (원본은 그대로 Save 대상)">Save As</button>
      <button class="btn primary" data-act="save" title="대화상자 없이 바로 저장합니다 (원본 파일에 바로 씀)">Save</button>`}
    </div>
    <div class="metastrip">
      <span class="ms-item"><b>owner</b>${cell('meta.owner',{cls:'mini',ph:'—'})}</span>
      <span class="ms-item"><b>status</b>${sel('meta.status',['draft','in_review','approved','frozen'],{cls:'mini'})}</span>
      <span class="ms-item"><b>phase</b>${sel('meta.phase',E.phase,{cls:'mini'})}</span>
      <span class="ms-item"><b>updated</b>${cell('meta.last_updated',{cls:'mono mini',ph:'YYYY-MM-DD'})}</span>
    </div>
    <div class="srchead">Input Source</div>
    <div class="srcbox">
      <span class="src-k">uArch</span>${cell('meta.uarch',{cls:'mono mini src-v',ph:'https://…'})}${/^https?:\/\//.test(DATA.meta.uarch||'')?`<a class="src-go" href="${esc(DATA.meta.uarch)}" target="_blank" rel="noopener" title="열기">↗</a>`:'<span></span>'}
      <span class="src-k">Ref-Model</span>${cell('meta.ref_model',{cls:'mono mini src-v',ph:'ref-model 경로'})}${/^https?:\/\//.test(DATA.meta.ref_model||'')?`<a class="src-go" href="${esc(DATA.meta.ref_model)}" target="_blank" rel="noopener" title="열기">↗</a>`:'<span></span>'}
      <span class="src-k">CSR</span>${cell('meta.csr',{cls:'mono mini src-v',ph:'SFR 엑셀 경로 (.xlsx) — 아직 없음'})}${/^https?:\/\//.test(DATA.meta.csr||'')?`<a class="src-go" href="${esc(DATA.meta.csr)}" target="_blank" rel="noopener" title="열기">↗</a>`:'<span></span>'}
    </div>
    <div class="tabs">${tabs}</div>
  </div>
  <div id="tabbody">${VIEW[TAB]()}</div>
  ${peekPane()}`;
  refreshTarget();
  stickTops();
}
/* The top bar wraps at narrow widths and the panel head grows with its filters, so the sticky offsets
   cannot be constants. They live on #app (not <html>) and serializeDoc() strips them, so a measured
   pixel value never gets baked into a saved plan. */
function stickTops(){
  const app=$('#app'); if(!app) return;
  const h=el=>el?Math.round(el.getBoundingClientRect().height):0;
  app.style.setProperty('--topbar-h',h($('.topbar'))+'px');
  app.style.setProperty('--head-h',  h($('.panel.stick > .panel-head'))+'px');
}
window.addEventListener('resize',stickTops);

/* The label where the buttons live: a snapshot says exactly when it was saved; the original says
   nothing at all — Save always lands on its own file, so there is nothing to announce. */
function refreshTarget(){
  const el=$('#save-target'); if(!el) return;
  el.textContent = (DATA.meta&&DATA.meta.snapshot) ? '저장됨: '+DATA.meta.snapshot.at : '';
}

const VIEW={};

/* ---- features --------------------------------------------------------- */
VIEW.features=()=>{
  const covered = new Set(DATA.items.flatMap(it=>it.feature_refs||[]));
  return `

/* ---- suggestions (AI proposes, human disposes) ------------------------- */
/* The agent inbox. It lives at the bottom of the tab it feeds — feature cards under Features,
   item cards under Verification Items — so a proposal is read next to what it would join.
   Accepted and rejected cards are never dropped. They fold into their own sections and stay in the
   file: a rejection carries the reason that stops the same proposal coming back next run. */
/* Related to is a feature→feature link, and only command features may be cited: the interesting
   cross-reference in this IP is "which command does this behavior belong to". Stored one-way on the
   feature that points, so a command feature's own list stays the commands IT relates to. */
const REL_CAT='command';
const REJECT_WHY={
  duplicated:'Right, but the plan already has it — my matching was too loose.',
  hallucinated:'The claim itself does not hold — my extraction or quote was wrong.',
  waived:'Right and in scope, but we are choosing not to verify it.',
};
function sugCard(s,all,kind,what){
  const i=all.indexOf(s), p=`suggestions.${i}`, done=s.status!=='pending';
  const cb={high:'b-ok',med:'b-warn',low:'b-mut'}[s.confidence]||'b-mut';
  const sb={pending:'b-warn',accepted:'b-ok',rejected:'b-mut'}[s.status]||'b-mut';
  const src=s.source||{};
  return `<div class="sug${done?' done':''}">
      <div class="sug-head">
        <span class="sid">${esc(s.sid)}</span>
        <span class="badge ${sb}">${esc(s.status)}</span>
        ${s.status==='rejected'&&s.reject_kind?`<span class="badge b-err" title="${esc(REJECT_WHY[s.reject_kind]||'')}">${esc(s.reject_kind)}</span>`:''}
        <span class="badge ${cb}">confidence ${esc(s.confidence||'?')}</span>
        <span class="hint">${esc(s.created||'')}</span>
        <div class="spacer"></div>
        ${done
          ? `<button class="btn sm" data-act="sug-reopen" data-i="${i}">Reopen</button>`
          : `<button class="btn sm primary" data-act="sug-accept" data-i="${i}">Accept → add ${kind==='item'?'item':'feature'}</button>
             ${(E.reject_kind||[]).map(k=>`<button class="btn sm" data-act="sug-reject" data-i="${i}" data-k="${k}" title="${esc(REJECT_WHY[k]||'')}">${esc(k[0].toUpperCase()+k.slice(1))}</button>`).join('')}`}
      </div>
      <div class="sug-body">
        <div class="sug-name">${cell(`${p}.payload.name`,{ph:`${what} name`})}</div>

        <div class="evi">
          <div class="evi-top">
            <span>${esc(src.doc||'source unknown')}</span>
            ${src.section?`<span class="badge b-acc">§ ${esc(src.section)}</span>`:''}
            ${src.url?`<a href="${esc(src.url)}" target="_blank" rel="noopener">Open in MAS ↗</a>`:''}
          </div>
          ${src.quote?`<div class="evi-q">"${esc(src.quote)}"</div>`:''}
        </div>

        <div class="why"><b>why</b>${esc(s.rationale||'')}</div>

        <div class="sug-wide">${field('Description',cell(`${p}.payload.description`))}</div>
        <div class="sug-fields">
          ${field('Category',sel(`${p}.payload.category`,E.category))}
          ${kind==='item'
            ? `${field('Link to',cell(`${p}.payload.feature_refs`,{kind:'csv',cls:'mono',ph:'F01'}))}
               ${field('Oracle',cell(`${p}.payload.oracle`,{ph:'what the result is compared against'}))}
               ${field('Stimulus',sel(`${p}.payload.stimulus`,E.stimulus))}
               ${field('Judged by',togChips(`${p}.payload.judged_by`,E.judged_by,s.payload&&s.payload.judged_by))}
               ${field('Phase',sel(`${p}.payload.phase`,E.phase))}`
            : field('Phase',sel(`${p}.payload.phase`,E.phase))}
        </div>
        <div class="sug-wide">${field('Notes',cell(`${p}.payload.notes`))}</div>
        ${s.status==='rejected'?`<div class="sug-wide">${field('Reject note (optional)',cell(`${p}.reject_reason`,{ph:'e.g. F06 already covers it / PREFETCH_EN=0 in r1p2'}),'Claude reads this next run')}</div>`:''}
        ${s.status==='accepted'&&s.accepted_as?`<div class="why"><b>accepted as</b><span class="badge b-acc">${esc(s.accepted_as)}</span></div>`:''}
      </div></div>`;
}
function sugPanel(kind){
  const all=DATA.suggestions||[];
  const mine=all.filter(s=>(s.kind||'feature')===kind);
  const g={pending:[],accepted:[],rejected:[]};
  mine.forEach(s=>(g[s.status]||g.pending).push(s));
  const what=kind==='item'?'verification item':'feature';
  const dest=kind==='item'?'the Verification items list':'the Feature list';
  const fold=(name,label)=>{
    const rows=g[name]; if(!rows.length) return '';
    const key=`${kind}:${name}`, open=SUGOPEN.has(key);
    const tally=name==='rejected'
      ? (E.reject_kind||[]).filter(k=>rows.some(r=>r.reject_kind===k))
          .map(k=>`<span class="badge b-mut">${esc(k)} ${rows.filter(r=>r.reject_kind===k).length}</span>`).join('')
      : '';
    return `<div class="sug-fold" data-act="sug-group" data-g="${key}">
        <span class="caret">${open?'▾':'▸'}</span><b>${label}</b>
        <span class="badge b-mut">${rows.length}</span>${tally}
        <span class="hint">${open?'click to fold':'kept in the file — click to open'}</span>
      </div>${open?rows.map(s=>sugCard(s,all,kind,what)).join(''):''}`;
  };
  /* Rejected sits ABOVE the inbox: it is a record of the plan (what was deliberately left out),
     not a leftover of the proposal queue — and it stays reachable without scrolling past every card. */
  return `
  ${g.rejected.length||g.accepted.length?`<div class="foldbox">${fold('rejected','Rejected — deliberately not planned')}${fold('accepted','Accepted — already in the plan')}</div>`:''}
  <p class="note">Proposals only — Claude Code reads the MAS and drafts the ${what}s it finds missing, but never
     writes into the plan. Check a card's quote, edit any field, then <b>Accept</b> to add it to ${dest}.
     Decided cards stay on record: accepted fold in below, rejected above.</p>
  <div class="panel"><div class="panel-head"><h2>Suggestions from AI</h2>
    <div class="chips">
      <span class="badge ${g.pending.length?'b-warn':'b-mut'}">${g.pending.length} pending</span>
      <span class="badge b-ok">${g.accepted.length} accepted</span>
      <span class="badge b-mut">${g.rejected.length} rejected</span>
    </div></div>
  <div class="panel-body">
  ${g.pending.length?g.pending.map(s=>sugCard(s,all,kind,what)).join('')
    :`<div class="lint-item"><span class="badge b-ok">OK</span><span>No pending suggestions.</span></div>`}
  </div></div>`;
}

/* ---- peek drawer (read a linked row without leaving the one you are on) --- */
/* Read-only on purpose: editing the same row in two places at once would need the caret handling
   render() deliberately does not have. The header links through to the row's own tab instead. */
function peekPane(){
  if(!PEEK) return '';
  const isItem=PEEK.kind==='item';
  const row=(isItem?DATA.items:DATA.features).find(r=>r.id===PEEK.id);
  const what=isItem?'Verification item':'Feature';
  if(!row) return `<div class="peek-pane" role="dialog" aria-label="${what} ${esc(PEEK.id)}">
      <div class="peek-head"><span class="sid">${esc(PEEK.id)}</span>
        <span class="badge b-err">gone</span><div class="spacer"></div>
        <button class="btn sm" data-act="peek-close" title="닫기 (Esc)">✕</button></div>
      <div class="peek-body"><p class="note">${esc(PEEK.id)} 은(는) 더 이상 플랜에 없습니다.</p></div></div>`;
  const line=(label,v)=>`<div class="peek-line"><b>${esc(label)}</b><span>${v||'<span class="hint">—</span>'}</span></div>`;
  const txt=v=>Array.isArray(v)?esc(v.join(', ')):esc(v==null?'':v);
  const linked=isItem?(row.feature_refs||[])
                     :DATA.items.filter(it=>(it.feature_refs||[]).includes(row.id)).map(it=>it.id);
  return `<div class="peek-pane" role="dialog" aria-label="${what} ${esc(row.id)}">
      <div class="peek-head">
        <span class="sid">${esc(row.id)}</span>
        <span class="hint">${esc(what)}</span>
        ${row.status?statusBadge(row.status):''}
        <div class="spacer"></div>
        <button class="btn sm" data-act="peek-goto" title="${isItem?'Verification items':'Features'} 탭에서 열기">Open ↗</button>
        <button class="btn sm" data-act="peek-close" title="닫기 (Esc)">✕</button>
      </div>
      <div class="peek-body">
        <div class="peek-name">${esc(row.name)||'<span class="hint">(이름 없음)</span>'}</div>
        ${line('category',txt(row.category))}
        ${line('phase',txt(row.phase))}
        ${isItem?line('implemented',txt(row.implemented)):''}
        ${isItem?line('stimulus',txt(row.stimulus)):''}
        ${isItem?line('judged by',txt(row.judged_by)):''}
        ${line(isItem?'verifies':'verified by',linked.length?linked.map(id=>`<span class="reflink">${esc(id)}</span>`).join(' '):'')}
        ${line('description',txt(row.description))}
        ${isItem?line('oracle',txt(row.oracle)):''}
        ${line('notes',txt(row.notes))}
      </div></div>`;
}

/* ---- audit (AI judges what is already in the plan) --------------------- */
/* The mirror image of the suggestion inbox. A suggestion says "the plan is missing this"; an audit
   card says "this row does not hold up against the source" — 누락 / 불충분 / 미스매치. Same card
   format, same contract: an agent appends, only Accept changes the plan. `fix` carries ONLY the
   fields to change, so accepting never blanks a field nobody judged. */
const FINDING_WHY={
  missing:'The source says something no row covers — accepting adds a row.',
  insufficient:'The row is right as far as it goes, but too thin to verify against.',
  mismatch:'The row contradicts the source, or has drifted from it.',
};
const FINDING_BADGE={missing:'b-err',insufficient:'b-warn',mismatch:'b-err'};
const auditRow=a=>((a.kind||'feature')==='item'?DATA.items:DATA.features).find(r=>r.id===a.target);
const FIX_LBL={name:'Name',description:'Description',category:'Category',phase:'Phase',
  status:'Definition',notes:'Notes',oracle:'Oracle',stimulus:'Stimulus',judged_by:'Judged by',
  feature_refs:'Link to',implemented:'Implemented'};
function auditCard(a,all,kind){
  const i=all.indexOf(a), p=`audits.${i}`, done=a.status!=='pending';
  const cb={high:'b-ok',med:'b-warn',low:'b-mut'}[a.confidence]||'b-mut';
  const sb={pending:'b-warn',accepted:'b-ok',rejected:'b-mut'}[a.status]||'b-mut';
  const src=a.source||{}, fnd=a.finding||'insufficient', adds=fnd==='missing';
  const row=adds?null:auditRow(a), lost=!adds&&!row, fix=a.fix||{};
  const editor=k=>{
    if(k==='category')    return sel(`${p}.fix.category`,E.category);
    if(k==='phase')       return sel(`${p}.fix.phase`,E.phase);
    if(k==='status')      return sel(`${p}.fix.status`,E.status);
    if(k==='stimulus')    return sel(`${p}.fix.stimulus`,E.stimulus);
    if(k==='implemented') return sel(`${p}.fix.implemented`,E.implemented);
    if(k==='judged_by')   return togChips(`${p}.fix.judged_by`,E.judged_by,fix.judged_by);
    if(k==='feature_refs')return cell(`${p}.fix.feature_refs`,{kind:'csv',cls:'mono',ph:'F01'});
    return cell(`${p}.fix.${k}`,{ph:FIX_LBL[k]||k});
  };
  /* Before → after, field by field: only what the card proposes is shown, and the proposal stays
     editable, so a human can soften a fix instead of rejecting the whole card. */
  const was=k=>{ const v=row?row[k]:undefined; return Array.isArray(v)?v.join(', '):(v==null?'':String(v)); };
  const fixFields=Object.keys(fix).map(k=>`
        <div class="afix">
          ${adds?'':`<div class="afix-was"><b>now</b><span>${was(k)?esc(was(k)):'<span class="hint">— empty —</span>'}</span></div>`}
          ${field(adds?(FIX_LBL[k]||k):`${FIX_LBL[k]||k} → proposed`,editor(k))}
        </div>`).join('');
  return `<div class="sug${done?' done':''}">
      <div class="sug-head">
        <span class="sid">${esc(a.aid)}</span>
        <span class="badge ${sb}">${esc(a.status)}</span>
        <span class="badge ${FINDING_BADGE[fnd]||'b-warn'}" title="${esc(FINDING_WHY[fnd]||'')}">${esc(fnd)}</span>
        ${adds?'':`<span class="badge ${lost?'b-err':'b-acc'}" title="${lost?'this row is gone — the card cannot be applied':'the row this card judges'}">${esc(a.target||'no target')}${lost?' — missing':''}</span>`}
        ${a.status==='rejected'&&a.reject_kind?`<span class="badge b-err" title="${esc(REJECT_WHY[a.reject_kind]||'')}">${esc(a.reject_kind)}</span>`:''}
        <span class="badge ${cb}">confidence ${esc(a.confidence||'?')}</span>
        <span class="hint">${esc(a.created||'')}</span>
        <div class="spacer"></div>
        ${done
          ? `<button class="btn sm" data-act="audit-reopen" data-i="${i}">Reopen</button>`
          : `<button class="btn sm primary" data-act="audit-accept" data-i="${i}">${adds?`Accept → add ${kind==='item'?'item':'feature'}`:`Accept → fix ${esc(a.target||'')}`}</button>
             ${(E.reject_kind||[]).map(k=>`<button class="btn sm" data-act="audit-reject" data-i="${i}" data-k="${k}" title="${esc(REJECT_WHY[k]||'')}">${esc(k[0].toUpperCase()+k.slice(1))}</button>`).join('')}`}
      </div>
      <div class="sug-body">
        <div class="evi">
          <div class="evi-top">
            <span>${esc(src.doc||'source unknown')}</span>
            ${src.section?`<span class="badge b-acc">§ ${esc(src.section)}</span>`:''}
            ${src.url?`<a href="${esc(src.url)}" target="_blank" rel="noopener">Open source ↗</a>`:''}
          </div>
          ${src.quote?`<div class="evi-q">"${esc(src.quote)}"</div>`:''}
        </div>
        <div class="why"><b>why</b>${esc(a.rationale||'')}</div>
        ${fixFields||`<div class="why"><b>note</b>no field change proposed — read the finding and decide by hand</div>`}
        ${a.status==='rejected'?`<div class="sug-wide">${field('Reject note (optional)',cell(`${p}.reject_reason`,{ph:'e.g. covered by VI004 / waived for r1p2'}),'Claude reads this next run')}</div>`:''}
        ${a.status==='accepted'&&a.accepted_as?`<div class="why"><b>applied to</b><span class="badge b-acc">${esc(a.accepted_as)}</span></div>`:''}
      </div></div>`;
}
function auditPanel(kind){
  const all=DATA.audits||[];
  const mine=all.filter(a=>(a.kind||'feature')===kind);
  const g={pending:[],accepted:[],rejected:[]};
  mine.forEach(a=>(g[a.status]||g.pending).push(a));
  const what=kind==='item'?'verification item':'feature';
  const fold=(name,label)=>{
    const rows=g[name]; if(!rows.length) return '';
    const key=`audit:${kind}:${name}`, open=SUGOPEN.has(key);
    return `<div class="sug-fold" data-act="sug-group" data-g="${key}">
        <span class="caret">${open?'▾':'▸'}</span><b>${label}</b>
        <span class="badge b-mut">${rows.length}</span>
        <span class="hint">${open?'click to fold':'kept in the file — click to open'}</span>
      </div>${open?rows.map(a=>auditCard(a,all,kind)).join(''):''}`;
  };
  const tally=(E.finding||[]).filter(f=>g.pending.some(a=>a.finding===f))
    .map(f=>`<span class="badge ${FINDING_BADGE[f]||'b-warn'}">${g.pending.filter(a=>a.finding===f).length} ${esc(f)}</span>`).join('');
  return `
  ${g.rejected.length||g.accepted.length?`<div class="foldbox">${fold('rejected','Rejected — findings not acted on')}${fold('accepted','Accepted — already applied')}</div>`:''}
  <p class="note">Findings against the Input Sources — where the plan's own ${what}s fall short, not what
     it never had. <b>Accept</b> applies the proposed change to the row the card names; nothing changes
     until you do.</p>
  <div class="panel"><div class="panel-head"><h2>Audit from AI</h2>
    <div class="chips">
      <span class="badge ${g.pending.length?'b-warn':'b-mut'}">${g.pending.length} pending</span>${tally}
      <span class="badge b-ok">${g.accepted.length} accepted</span>
      <span class="badge b-mut">${g.rejected.length} rejected</span>
    </div></div>
  <div class="panel-body">
  ${g.pending.length?g.pending.map(a=>auditCard(a,all,kind)).join('')
    :`<div class="lint-item"><span class="badge b-ok">OK</span><span>No pending findings.</span></div>`}
  </div></div>`;
}

function nextId(arr,prefix,pad){
  let n=0; arr.forEach(x=>{const m=String((x&&x.id)||'').match(new RegExp('^'+prefix+'(\\d+)$')); if(m) n=Math.max(n,+m[1]);});
  return prefix+String(n+1).padStart(pad,'0');
}
/* most-used base_test across existing testcases — new testcases inherit it */
function commonBaseTest(){
  const tally={};
  DATA.testcases.forEach(t=>{const b=t.uvm&&t.uvm.base_test; if(b) tally[b]=(tally[b]||0)+1;});
  return Object.keys(tally).sort((a,b)=>tally[b]-tally[a])[0]||'';
}
